schema: spec-driven

context: |
  ## Proyecto y alcance

  TikkiGuau es una marca argentina de collares y correas personalizados para perros y gatos.
  Este repositorio (`tikkiguau-web`) es una app Next.js que concentra:
  - Sitio web público en `tikkiguau.com` (landing + diseñador interactivo)
  - Panel de administración (CMS) en `/admin`

  **Alcance OpenSpec:** solo `tikkiguau-web`. El repo hermano `tikkiguau-tiendas` (app de tiendas físicas en `app.tikkiguau.com`) existe y comparte la misma base de datos Neon Postgres, pero queda fuera de alcance — no modificarlo ni depender de él salvo como referencia histórica.

  Documentación extendida del ecosistema: `docs/DOCUMENTATION.md` (en la raíz del monorepo local).

  ## Estado actual de implementación

  **Implementado:**
  - CMS completo: auth Better Auth, gestión de órdenes, gestión de tiendas (`/admin`, `/admin/tiendas`)
  - API routes protegidas: `GET/PATCH /api/orders/[id]`, `GET /api/orders`, `GET/POST /api/stores`, `PATCH /api/stores/[id]`
  - Homepage (`/`) con todas las secciones: Navbar, Hero, Productos, Galería, Medidas, Envíos, Testimonios, FAQ, Footer
  - Tipos y catálogo en `types/collar.ts` (precios, colores, emojis, tallas)
  - Componentes del diseñador: `CollarPreview`, `LeashPreview`, emojis SVG en `components/designer/custom-emojis/`

  **Pendiente (prioridad del sitio web):**
  - Ruta `/disenar` con stepper completo (referenciada desde Navbar/Hero/Productos pero aún no existe)
  - `POST /api/orders` para crear órdenes desde el sitio web (guest checkout)
  - Pantalla de confirmación con número de orden (formato `TK-XXXX`) y CTA a WhatsApp
  - SEO: sitemap, robots.txt, metadata Open Graph
  - Fase 5: reemplazar placeholders de imágenes y validar copy del FAQ con la clienta

  ## Stack técnico

  - **Framework:** Next.js 16 (App Router), React 19, TypeScript estricto (evitar `any`)
  - **Estilos:** Tailwind CSS v4, shadcn/ui, variables de marca en `app/globals.css`
  - **Tipografía:** Poppins (`app/layout.tsx`), idioma `es`
  - **Base de datos:** Neon Postgres + Prisma 7 (adapter Neon, client generado en `app/generated/prisma`)
  - **Auth (solo CMS):** Better Auth con email/password, Prisma adapter, ruta `/api/auth/[...all]`
  - **Data fetching (CMS):** TanStack Query v5 + Axios en hooks bajo `app/admin/(protected)/hooks/`
  - **Formularios:** react-hook-form + zod (ej. `app/admin/sign-in/schemas/`)
  - **Notificaciones:** sonner (Toaster en layout admin)
  - **Deploy:** Vercel

  ## Estructura del proyecto

  ```
  app/
    page.tsx                    → Homepage
    layout.tsx, providers.tsx, globals.css
    admin/
      sign-in/                  → Login CMS
      (protected)/              → Dashboard órdenes, tiendas, hooks y componentes admin
    api/
      auth/[...all]/            → Better Auth
      orders/, orders/[id]/     → CRUD órdenes (admin)
      stores/, stores/[id]/     → CRUD tiendas (admin)
  components/
    web/                        → Secciones del sitio público
    designer/                   → Previews y emojis del diseñador
    admin/                      → Sidebar, diálogos admin
    ui/                         → shadcn/ui primitivos
  types/collar.ts               → Fuente de verdad: catálogo, colores, tipos del diseñador
  lib/                          → auth, auth-client, prisma, env (zod), utils (cn)
  prisma/schema.prisma          → Modelos de BD
  prisma/seed.ts                → Seeder admin (`npm run seed`)
  ```

  ## Convenciones de código

  - Path alias `@/` apunta a la raíz del proyecto
  - Componentes web en `components/web/`, admin scoped bajo `app/admin/(protected)/`
  - Hooks de TanStack Query: `use-<recurso>.ts` con queryKey descriptivos
  - API routes: verificar sesión con `auth.api.getSession({ headers: await headers() })` antes de operaciones admin
  - Validación de env vars centralizada en `lib/env.ts` con zod
  - Preferir composición, funciones con responsabilidad única, nombres descriptivos en español para UI/copy y en inglés para código
  - Reutilizar tipos de `types/collar.ts` en lugar de duplicar constantes de catálogo
  - UI copy y contenido orientado al usuario final en español (Argentina)

  ## Dominio de negocio

  **Modelo comercial:** reserva de pedido, no e-commerce con pasarela. Guest checkout sin registro de usuarios en el sitio web.

  **Productos** (precios en `types/collar.ts`, fuente de verdad del código):
  | Producto | Precio ARS | Piezas |
  |----------|------------|--------|
  | Collar   | $20.000    | 6      |
  | Correa   | $26.000    | 10     |
  | Combo    | $39.000    | 16 (6 collar + 10 correa) |

  **Personalización:** colores de collar/correa, letras y emojis custom. Catálogo hardcodeado en frontend (`COLLAR_COLORS`, `CUSTOM_EMOJIS`, `ELEMENT_COLORS`). Mínimo 3 y máximo 6/10 piezas según producto.

  **Flujo web (objetivo):**
  1. Cliente diseña en `/disenar` → carrito con uno o más ítems
  2. Datos: nombre, apellido, email, teléfono (sin palabra clave de tienda)
  3. Método de entrega: `PICKUP` | `CORREO_DOMICILIO` | `CORREO_SUCURSAL`
  4. Orden creada con `storeId: null`, estado `PENDING`, `orderItems` JSON con diseño completo
  5. Confirmación muestra número de orden; Melizza contacta por WhatsApp para total final (incl. envío) y datos de transferencia
  6. Pago exclusivamente por transferencia bancaria; comprobante por WhatsApp citando número de orden

  **Diferencia vs app de tiendas (referencia, fuera de alcance):** órdenes de tienda tienen `storeId`; las del sitio web no. La app de tiendas usa pago en efectivo en tienda física.

  **Contacto:**
  - WhatsApp: +54 9 11 2181-6245 (`wa.me/5491121816245`)
  - Instagram: https://www.instagram.com/tikkiguau/

  ## Base de datos (Prisma)

  Tablas compartidas con `tikkiguau-tiendas`:
  - **Better Auth:** `users`, `sessions`, `accounts`, `verifications`
  - **Order:** `orderNumber` (único, ej. TK-1001), `status` (PENDING → APPROVED → REJECTED → DELIVERED), datos guest, `deliveryMethod`, dirección opcional, `trackingCode`, `totalAmount`, `orderItems` (Json), `storeId` opcional
  - **Store:** `name`, `keyword` (único), `isActive` — usado por CMS y app de tiendas

  Enums: `OrderStatus`, `DeliveryMethod` (PICKUP, CORREO_DOMICILIO, CORREO_SUCURSAL)

  ## CMS (`/admin`)

  - Ruta protegida: redirect a `/admin/sign-in` si no hay sesión
  - Usuario admin único, creado con `npm run seed` (requiere ADMIN_NAME, ADMIN_EMAIL, ADMIN_PASSWORD)
  - Dashboard: tabla de órdenes, cambio de estado, carga manual de tracking Correo Argentino
  - Tiendas: listado, creación, activación/desactivación

  ## Variables de entorno requeridas

  ```
  DATABASE_URL=postgresql://...
  BETTER_AUTH_SECRET=...   # min 16 chars
  BETTER_AUTH_URL=https://tikkiguau.com
  ADMIN_NAME=...           # solo seeder
  ADMIN_EMAIL=...          # solo seeder
  ADMIN_PASSWORD=...       # solo seeder
  ```

  ## Marca visual

  Color principal: `#C70F11` (rojo TikkiGuau). Paleta completa en `app/globals.css` (`--brand-*`) y `types/collar.ts` (`COLLAR_COLORS`).

  ## Roadmap cercano (catálogo dinámico en CMS)

  El catálogo hoy está hardcodeado en `types/collar.ts`. La próxima feature prioritaria es persistirlo en Prisma y gestionarlo desde `/admin`:
  - Colores de collar/correa (CRUD, activar/desactivar)
  - Letras del abecedario con colores disponibles por letra (las letras son fijas A–Z; lo configurable son sus colores)
  - Emojis personalizados con colores (agregar, quitar, activar/desactivar; los SVG viven en `components/designer/custom-emojis/`)
  - Precios de productos: collar, correa, combo
  - Precios de envío: Correo Argentino a domicilio y a sucursal (retiro en domicilio sin costo)

  Las órdenes existentes guardan snapshot del diseño en `orderItems` (JSON); los cambios de catálogo no deben alterar pedidos ya creados.

rules:
  proposal:
    - 'Incluir siempre secciones "Non-goals" y "Impacto en datos existentes"'
    - 'Declarar explícitamente si el change toca la BD compartida con tikkiguau-tiendas; por defecto tikkiguau-tiendas queda fuera de alcance'
    - 'Para cambios de catálogo/precios: explicar migración desde constantes estáticas (types/collar.ts) y estrategia de seed inicial'
    - Mantener el proposal conciso (máx. ~600 palabras); priorizar el porqué y el alcance, no el cómo técnico detallado
    - UI copy y descripciones de negocio en español (Argentina); identificadores técnicos en inglés

  specs:
    - Usar palabras clave RFC 2119 (SHALL, MUST, SHOULD, MAY) en requirements
    - Cada requirement debe tener al menos un scenario con formato WHEN/THEN (o GIVEN/WHEN/THEN si aplica)
    - Separar requirements de admin (CMS, auth requerida) y público (sitio web, diseñador, guest)
    - Para entidades de catálogo: cubrir CRUD admin, estado activo/inactivo, y lectura pública solo de ítems activos
    - 'Para precios (productos y envíos): especificar moneda ARS, que órdenes ya creadas conservan el snapshot en orderItems y no se recalculan'
    - 'Para emojis: distinguir metadatos en BD (key, label, colores, activo) del componente SVG asociado por key'
    - 'Para letras: el conjunto A–Z es fijo; lo configurable son los colores permitidos por letra'
    - 'Reutilizar patrones existentes (ej. gestión de tiendas en /admin/tiendas) antes de inventar flujos nuevos'

  design:
    - 'Seguir el orden de capas del proyecto: Prisma schema + migración → seed → API routes (app/api/) → hooks TanStack Query → UI admin (app/admin/(protected)/) → consumidores públicos (components/web/, components/designer/)'
    - 'Toda ruta de escritura del CMS debe verificar sesión con auth.api.getSession (mismo patrón que orders/stores)'
    - 'Validar payloads con zod en API routes; tipos compartidos sin usar any'
    - 'Hooks admin: use-<recurso>.ts con Axios, queryKeys descriptivos, invalidación en mutations'
    - Formularios admin: react-hook-form + zod, diálogos con componentes shadcn existentes
    - 'Modelar catálogo con tablas normalizadas y campos isActive/sortOrder donde aplique; evitar JSON blobs para datos editables del CMS'
    - 'Incluir plan de seed que reproduzca los valores actuales de types/collar.ts como datos iniciales'
    - 'Documentar impacto en orderItems JSON: los pedidos guardan snapshot; el diseñador lee catálogo vigente al crear la orden'
    - 'Si un emoji nuevo requiere SVG, indicar convención de archivo en components/designer/custom-emojis/ y componente en EmojiRenderer'
    - 'No modificar tikkiguau-tiendas salvo que el proposal lo declare explícitamente'

  tasks:
    - 'Ordenar tareas en fases: schema Prisma → migración → seed → API → hooks → UI admin → migrar consumidores del catálogo estático'
    - 'Cada tarea debe ser completable en una sesión (máx. ~2–3 horas); dividir si es más grande'
    - 'Incluir tareas explícitas de prisma migrate y prisma generate cuando cambie el schema'
    - 'Referenciar rutas de archivo concretas siguiendo la estructura del proyecto (app/admin/(protected)/, app/api/, types/, prisma/)'
    - 'Marcar dependencias entre tareas cuando el orden importe (ej. API antes que UI)'
    - 'Incluir verificación manual mínima por fase (ej. CRUD en admin, lectura en diseñador/homepage)'
    - 'No incluir tareas de tikkiguau-tiendas a menos que el proposal lo exija'
